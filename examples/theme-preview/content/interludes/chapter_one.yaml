id: chapter_one
# Optional: background image shown fullscreen during the interlude.
# background: assets/images/banners/chapter_one.jpg

# Optional: decorative border/frame image overlaid on the background.
# banner: assets/images/ui/chapter_frame.png

# Optional: music to play during this interlude.
# music: assets/audio/music/chapter_theme.ogg

# The narrative text. Supports @localization.key or plain text.
text: "Chapter One: A New Beginning\n\nThe road behind you stretches long and empty.\nAhead, the lights of town flicker through the evening mist.\n\nYou have heard the rumours. Strange things happening.\nPeople going missing. Shadows that move wrong.\n\nSomeone has to look into it.\n\nIt might as well be you.\n"

# Auto-trigger when the player enters the tavern for the first time.
# triggerConditions prevents re-triggering. effects runs when the interlude fires
# setFlag here marks it seen so it won't show again on return visits.
triggerLocation: tavern
triggerConditions:
  - type: notFlag
    flag: seenChapterOne
effects:
  - type: setFlag
    flag: seenChapterOne
