name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-checks:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.checks.outputs.product }}
      studio_e2e: ${{ steps.checks.outputs.studio_e2e }}
      release: ${{ steps.checks.outputs.release }}
      docs: ${{ steps.checks.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select the checks this change needs
        id: checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/select-checks.mjs

  release-checks:
    name: Release scripts and workflows
    needs: select-checks
    if: needs.select-checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test release scripts and workflows
        run: node --test "scripts/__tests__/*.test.mjs"

  quality:
    name: Typecheck and coverage
    needs: select-checks
    if: needs.select-checks.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck Studio
        run: yarn typecheck

      - name: Test with coverage
        run: yarn test:coverage

  studio-e2e:
    name: Studio end-to-end
    needs: select-checks
    if: needs.select-checks.outputs.studio_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Core
        run: yarn workspace @doodle-engine/core build

      - name: Build Toolkit
        run: yarn workspace @doodle-engine/toolkit build

      - name: Build Studio
        run: yarn workspace @doodle-engine/studio build

      - name: Studio end-to-end
        run: xvfb-run --auto-servernum yarn workspace @doodle-engine/studio test:e2e:run

  docs:
    name: Documentation
    needs: select-checks
    if: needs.select-checks.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install documentation dependencies
        run: yarn --cwd docs install --immutable

      - name: Build documentation
        run: yarn --cwd docs build

  verify:
    if: always()
    needs: [select-checks, release-checks, quality, studio-e2e, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        env:
          RESULTS: >-
            ${{ needs.select-checks.result }}
            ${{ needs.release-checks.result }}
            ${{ needs.quality.result }}
            ${{ needs.studio-e2e.result }}
            ${{ needs.docs.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required check reported $result."; exit 1 ;;
            esac
          done
