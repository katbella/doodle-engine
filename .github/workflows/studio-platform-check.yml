name: Studio Platform Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-platform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Studio tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Studio
        run: yarn workspace @doodle-engine/studio test
