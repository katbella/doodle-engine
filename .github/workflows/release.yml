name: Release Doodle Engine

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-doodle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pull-request:
    name: Create the release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release Doodle Engine must be run from main."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check release credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "The NPM_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Prepare the next version
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prepare --bump "${{ inputs.bump }}"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release.mjs open-pull-request
          --version "${{ steps.prepare.outputs.version }}"
          --previous-version "${{ steps.prepare.outputs.previous_version }}"
